<body><main class="app"><header class="top"><div><div class="eyebrow">FOCUS TIMER</div><h1>Pomodoro <span>3D</span></h1></div><div class="actions"><button id="install" class="icon install hidden">⇩</button><button id="settings" class="icon">⚙</button></div></header>
<nav class="modes"><button class="mode active" data-mode="focus">Focus</button><button class="mode" data-mode="short">Short break</button><button class="mode" data-mode="long">Long break</button></nav>
<section id="scene" class="scene"><div class="shadow"></div><div id="tomato" class="tomato"><div class="leaf stem"></div><button id="dial" class="dial" aria-label="Drag to adjust minutes"></button><div class="leaf l1"></div><div class="leaf l2"></div><div class="body"><div class="rim"></div><div class="face"><div class="glass"><div class="status"><span id="label">FOCUS</span><span id="live" class="dot"></span></div><div id="time" class="time">25:00</div><div class="track"><div id="bar" class="bar"></div></div><div class="small"><span id="session">Session 1 of 4</span><span id="today">0 today</span></div></div></div></div><div class="base"></div></div><div id="hint" class="hint">Drag the top dial to adjust time</div></section>
<section class="controls"><button id="reset" class="secondary">↺</button><button id="start" class="primary">▶ &nbsp; Start</button><button id="skip" class="secondary">⏭</button></section>
<section class="card"><div class="cardhead"><span>Current cycle</span><button id="soundQuick" class="link">Sound on</button></div><div id="dots" class="dots"></div></section><section class="stats"><div class="stat"><b id="count">0</b><span>Focus sessions today</span></div><div class="stat"><b id="minutes">0</b><span>Focus minutes today</span></div></section></main>
<div id="scrim" class="scrim hidden"></div><aside id="sheet" class="sheet"><div class="sheettop"><div><div class="eyebrow">CUSTOMIZE</div><h2>Timer settings</h2></div><button id="close" class="icon">✕</button></div>
<div class="group"><h3>Durations</h3><label class="row"><span>Focus minutes</span><input id="focus" type="number" min="1" max="120"></label><label class="row"><span>Short break</span><input id="short" type="number" min="1" max="60"></label><label class="row"><span>Long break</span><input id="long" type="number" min="1" max="90"></label><label class="row"><span>Long break after</span><input id="sessions" type="number" min="1" max="12"></label></div>
<div class="group"><h3>Automation</h3><label class="row switch"><span>Auto-start breaks</span><input id="autoBreak" type="checkbox"></label><label class="row switch"><span>Auto-start focus</span><input id="autoFocus" type="checkbox"></label><label class="row switch"><span>Keep screen awake</span><input id="wake" type="checkbox"></label></div>
<div class="group"><h3>Feedback</h3><label class="row switch"><span>Completion sound</span><input id="sound" type="checkbox"></label><label class="row switch"><span>Vibration</span><input id="vibrate" type="checkbox"></label><label class="row switch"><span>3D motion</span><input id="motion" type="checkbox"></label><button id="notify" class="wide">Enable notifications</button></div><div class="group"><button id="resetStats" class="wide">Reset today's statistics</button></div></aside><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),modes=[...document.querySelectorAll('.mode')],K='p3d-state',KS='p3d-settings',KT='p3d-stats',D={focus:25,short:5,long:15,sessions:4,autoBreak:false,autoFocus:false,wake:true,sound:true,vibrate:true,motion:true};let cfg={...D,...get(KS,{})},st=get(K,null),stats=get(KT,{date:day(),count:0,minutes:0});if(stats.date!==day())stats={date:day(),count:0,minutes:0};let S={mode:st?.mode||'focus',running:!!st?.running,remaining:st?.remaining||0,duration:st?.duration||0,end:st?.end||null,cycle:Math.max(0,st?.cycle||0)},timer=null,wakelock=null,prompt=null,audio=null,drag=null,toastTimer=null;if(!S.duration){S.duration=dur(S.mode);S.remaining=S.duration}function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(KS,JSON.stringify(cfg));localStorage.setItem(KT,JSON.stringify(stats))}function day(){let d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dur(m){return(cfg[m]||25)*60}function fmt(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function render(){if(stats.date!==day()){stats={date:day(),count:0,minutes:0};save()}$('time').textContent=fmt(S.remaining);$('label').textContent=S.mode==='focus'?'FOCUS':S.mode==='short'?'SHORT BREAK':'LONG BREAK';$('live').classList.toggle('live',S.running);$('tomato').classList.toggle('run',S.running);$('start').innerHTML=S.running?'❚❚ &nbsp; Pause':(S.remaining<S.duration?'▶ &nbsp; Resume':'▶ &nbsp; Start');$('bar').style.width=(Math.max(0,Math.min(1,1-S.remaining/Math.max(1,S.duration)))*100)+'%';$('session').textContent='Session '+Math.min(S.cycle+1,cfg.sessions)+' of '+cfg.sessions;$('today').textContent=stats.count+' today';$('count').textContent=stats.count;$('minutes').textContent=stats.minutes;$('soundQuick').textContent=cfg.sound?'Sou
